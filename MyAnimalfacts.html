<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Fact</title>
</head>

 <style>
    body { 
        background-color: blue;
        font-family: Verdana;
    }
    .fact-file { 
        background-color: azure;
        color:rgb(78, 63, 191);
        width: 260px;
        padding: 25px;
        border: 4px solid darkslategray;
        margin: 30px;
    }

    /* Animal name - rgb(78, 63, 191) */
    .animal-name {
        color:black;
        font-size: 22px;
     }

     /* Detail rows - dark text on the light background */
     .detail { 
        color:antiquewhite;
     }
     .cool-fact{
        color:rgb(178, 118, 62);
        font-style: italic;
      }


 </style>
<body>
    
    <div class="fact-file">
        <h2 class="animal-name">Orangutan</h2>
        <p class="detail">Type: Ape</p>
        <p class="detail">Lives in: Forests of Southern Asia</p>
        <p class="detail">Diet: Leaves</p>
        <p class="cool-fact">Cool fact: Can defend its territory marvelously</p>
    </div>
</body>
</html>
